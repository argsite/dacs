<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DACS - Data ACS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
</head>
<body class="bg-gray-50 h-full p-4">

    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">DACS - Data ACS</h1>
        <p class="text-gray-500 mb-6 text-sm" id="status">Carregando motor de análise...</p>
        
        <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6 hidden" id="progress-container">
            <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
        </div>

        <div id="cat-container" class="hidden text-center mb-6">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqbmV0dGg0bm54eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/JIX9t2j0ZTN9S/giphy.gif" alt="Gato digitando" class="mx-auto rounded-lg shadow-md w-48">
            <p class="text-sm text-blue-600 font-medium mt-3 italic">Aguarde enquanto eu crio um relatório bem legal pra você. Vai valer a pena!</p>
        </div>

        <div id="drop-area" class="border-2 border-dashed border-blue-200 rounded-xl p-8 text-center cursor-pointer hover:border-blue-400 transition-colors mb-6">
            <input type="file" id="file-input" class="hidden" accept=".db">
            <div id="upload-label">
                <p class="font-medium text-gray-700">Clique para selecionar seu arquivo .db</p>
            </div>
            <p id="file-name" class="hidden text-blue-600 font-semibold truncate"></p>
        </div>

        <button id="process-btn" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white font-bold py-3 px-4 rounded-lg transition-all">
            Processar Análise Completa
        </button>
        <a id="download-btn" class="hidden w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition-all text-center mt-4">
            Baixar Relatório Excel
        </a>
    </div>

    <script>
        let pyodide;
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const statusEl = document.getElementById('status');
        const catContainer = document.getElementById('cat-container');

        async function init() {
            pyodide = await loadPyodide();
            await pyodide.loadPackage(["micropip", "sqlite3"]);
            const micropip = pyodide.pyimport("micropip");
            await micropip.install(["pandas", "openpyxl"]);
            
            pyodide.runPython(`
                import pandas as pd
                import sqlite3
                import io
                from datetime import datetime

                def format_date(ts):
                    try:
                        if pd.isna(ts) or ts == 0: return ""
                        return datetime.fromtimestamp(ts/1000).strftime('%d/%m/%Y')
                    except: return str(ts)

                def analyze_db(db_buffer):
                    with open("temp.db", "wb") as f: f.write(db_buffer)
                    conn = sqlite3.connect("temp.db")
                    output = io.BytesIO()
                    
                    with pd.ExcelWriter(output, engine='openpyxl') as writer:
                        # 1. Pacientes e Cadastros
                        df = pd.read_sql_query("SELECT * FROM paciente", conn)
                        cols_to_fmt = ['dataNascimento', 'dataUltimaAlteracaoCadastral']
                        for c in cols_to_fmt:
                            if c in df.columns: df[c] = df[c].apply(format_date)
                        
                        df[df['cpf'].isna()].to_excel(writer, sheet_name='Pacientes CPF Vazio', index=False)
                        df[(df['nomeMae'].isna()) | (df['dataNascimento'] == "")].to_excel(writer, sheet_name='Cadastros Incompletos', index=False)
                        
                        # 2. Endereços
                        df_end = pd.read_sql_query("SELECT * FROM endereco", conn)
                        df_end[df_end['cep'].isin(['18540000', '18540-000'])].to_excel(writer, sheet_name='CEP Antigo', index=False)
                        
                    output.seek(0)
                    return output.getvalue().hex()
            `);
            statusEl.textContent = "O está DACS pronto! Selecione o arquivo.";
        }
        init();

        document.getElementById('drop-area').onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = (e) => {
            document.getElementById('upload-label').classList.add('hidden');
            document.getElementById('file-name').textContent = e.target.files[0].name;
            document.getElementById('file-name').classList.remove('hidden');
            document.getElementById('process-btn').disabled = false;
        };

        document.getElementById('process-btn').onclick = async () => {
            progressContainer.classList.remove('hidden');
            catContainer.classList.remove('hidden');
            progressBar.style.width = "30%";
            statusEl.textContent = "Lendo base de dados...";
            
            const buffer = await document.getElementById('file-input').files[0].arrayBuffer();
            const hex = Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
            
            progressBar.style.width = "70%";
            statusEl.textContent = "Gerando relatórios (cruzando tabelas)...";
            
            const resultHex = pyodide.runPython(`analyze_db(bytes.fromhex("${hex}"))`);
            
            progressBar.style.width = "100%";
            catContainer.classList.add('hidden');
            statusEl.textContent = "Análise concluída!";
            const dl = document.getElementById('download-btn');
            dl.href = URL.createObjectURL(new Blob([new Uint8Array(resultHex.match(/.{1,2}/g).map(b => parseInt(b, 16)))], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
            dl.download = "Relatorio_DACS.xlsx";
            dl.classList.remove('hidden');
        };
    </script>
</body>
</html>
