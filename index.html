<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DACS - Data ACS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
</head>
<body class="bg-gray-50 h-full p-4">
    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">DACS - Data ACS</h1>
        <p class="text-gray-500 mb-6 text-sm" id="status">Carregando motor de análise...</p>
        
        <div class="w-full bg-gray-200 rounded-full h-5 mb-6 hidden" id="progress-container">
            <div id="progress-bar" class="bg-blue-600 h-5 rounded-full text-xs text-white text-center leading-5 transition-all duration-500" style="width: 0%">0%</div>
        </div>

        <div id="cat-container" class="hidden text-center mb-6">
            <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="Gato digitando" class="mx-auto rounded-lg shadow-md w-48">
            <p class="text-sm text-blue-600 font-medium mt-3 italic">Aguarde enquanto eu crio um relatório bem legal pra você.<br>Vai valer a pena!</p>
        </div>

        <div id="drop-area" class="border-2 border-dashed border-blue-200 rounded-xl p-8 text-center cursor-pointer hover:border-blue-400 transition-colors mb-6">
            <input type="file" id="file-input" class="hidden" accept=".db">
            <div id="upload-label">
                <p class="font-medium text-gray-700">Clique para selecionar seu arquivo .db</p>
            </div>
            <p id="file-name" class="hidden text-blue-600 font-semibold truncate"></p>
        </div>

        <button id="process-btn" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white font-bold py-3 px-4 rounded-lg transition-all">
            Gerar o Relatório
        </button>
        <a id="download-btn" class="hidden w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition-all text-center mt-4">
            Baixar Relatório Excel
        </a>
    </div>

    <script>
        let pyodide;
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const statusEl = document.getElementById('status');
        const catContainer = document.getElementById('cat-container');
        const processBtn = document.getElementById('process-btn');
        const downloadBtn = document.getElementById('download-btn');

        async function init() {
            pyodide = await loadPyodide();
            await pyodide.loadPackage(["micropip", "sqlite3"]);
            const micropip = pyodide.pyimport("micropip");
            await micropip.install(["pandas", "openpyxl"]);
            
            pyodide.runPython(`
                import pandas as pd
                import sqlite3
                import io

                def format_date(df, col):
                    if col in df.columns:
                        df[col] = pd.to_datetime(df[col], unit='ms', errors='coerce').dt.strftime('%d/%m/%Y')
                    return df

                def analyze_db(db_buffer):
                    with open("temp.db", "wb") as f: f.write(db_buffer)
                    conn = sqlite3.connect("temp.db")
                    output = io.BytesIO()
                    
                    with pd.ExcelWriter(output, engine='openpyxl') as writer:
                        df_pac = pd.read_sql_query("SELECT * FROM paciente", conn)
                        for col in ['dataNascimento', 'resideDesde', 'dataUltimaAlteracaoCadastral']:
                            df_pac = format_date(df_pac, col)

                        df_pac.to_excel(writer, sheet_name='Todos Pacientes', index=False)
                        
                        df_cpf = df_pac[(df_pac['cpf'].isna()) | (df_pac['cpf'].astype(str).str.len() != 11)]
                        df_cpf.to_excel(writer, sheet_name='CPF Inválido', index=False)

                        mask_sem_tel = df_pac['telefone'].isna() & df_pac['celular'].isna()
                        df_pac[mask_sem_tel].to_excel(writer, sheet_name='Sem Telefone', index=False)
                        
                        df_inc = df_pac[(df_pac['nomeMae'].isna()) | (df_pac['dataNascimento'].isna())]
                        df_inc.to_excel(writer, sheet_name='Cadastros Incompletos', index=False)

                        try:
                            df_end = pd.read_sql_query("SELECT * FROM endereco", conn)
                            df_cep = df_end[df_end['cep'].isin(['18540000', '18540-000'])]
                            df_cep.to_excel(writer, sheet_name='CEP Antigo', index=False)
                        except: pass

                        try:
                            df_h = pd.read_sql_query("SELECT p.*, h.dataCadastro as dataH, d.dataCadastro as dataD FROM paciente p LEFT JOIN fichaHipertensao h ON p.id = h.pacienteId LEFT JOIN fichaDiabetes d ON p.id = d.pacienteId WHERE h.id IS NOT NULL OR d.id IS NOT NULL", conn)
                            df_h.to_excel(writer, sheet_name='Hipertensos e Diabéticos', index=False)
                        except: pass

                        try:
                            df_v = pd.read_sql_query("SELECT p.*, n.vacinaAtrasada FROM paciente p JOIN notificacaoPaciente n ON p.id = n.pacienteId WHERE n.vacinaAtrasada = 1", conn)
                            df_v.to_excel(writer, sheet_name='Vacinas Atrasadas', index=False)
                        except: pass
                        
                    output.seek(0)
                    return output.getvalue().hex()
            `);
            statusEl.textContent = "DACS Pronto. Selecione o arquivo.";
        }
        init();

        document.getElementById('drop-area').onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = (e) => {
            document.getElementById('upload-label').classList.add('hidden');
            document.getElementById('file-name').textContent = e.target.files[0].name;
            document.getElementById('file-name').classList.remove('hidden');
            processBtn.disabled = false;
        };

        function updateProgress(percent, msg) {
            progressBar.style.width = percent + "%";
            progressBar.textContent = percent + "%";
            statusEl.textContent = msg;
        }

        processBtn.onclick = async () => {
            progressContainer.classList.remove('hidden');
            catContainer.classList.remove('hidden');
            processBtn.classList.add('hidden');
            
            updateProgress(20, "Lendo base de dados...");
            const buffer = await document.getElementById('file-input').files[0].arrayBuffer();
            const hex = Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
            
            updateProgress(60, "Formatando dados e realizando cruzamentos...");
            const resultHex = pyodide.runPython(`analyze_db(bytes.fromhex("${hex}"))`);
            
            updateProgress(100, "Análise concluída!");
            catContainer.classList.add('hidden');
            
            downloadBtn.href = URL.createObjectURL(new Blob([new Uint8Array(resultHex.match(/.{1,2}/g).map(b => parseInt(b, 16)))], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
            downloadBtn.download = "Relatorio_DACS.xlsx";
            downloadBtn.classList.remove('hidden');
        };
    </script>
</body>
</html>
