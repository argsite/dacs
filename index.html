<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data ACS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
</head>
<body class="bg-gray-50 h-full flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <h1 class="text-2xl font-bold text-gray-800 mb-2"Data ACSs</h1>
        <p class="text-gray-500 mb-6 text-sm">Carregue seu arquivo .db para gerar o relatório Excel instantaneamente.</p>
        
        <div id="drop-area" class="border-2 border-dashed border-blue-200 rounded-xl p-8 text-center cursor-pointer hover:border-blue-400 transition-colors mb-6">
            <input type="file" id="file-input" class="hidden" accept=".db">
            <div id="upload-label">
                <svg class="w-12 h-12 mx-auto text-blue-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p class="font-medium text-gray-700">Clique para enviar ou arraste o arquivo</p>
            </div>
            <p id="file-name" class="hidden text-blue-600 font-semibold truncate"></p>
        </div>

        <button id="process-btn" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white font-bold py-3 px-4 rounded-lg transition-all">
            Processar Análise
        </button>
        <a id="download-btn" class="hidden w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition-all text-center mt-4">
            Baixar Excel
        </a>
    </div>

    <script>
        let pyodide;
        let uploadedFile = null;

        async function init() {
            pyodide = await loadPyodide();
            await pyodide.loadPackage(["pandas", "xlsxwriter"]);
            
            // Injecting the core analysis logic into the python environment
            pyodide.runPython(`
                import pandas as pd
                import sqlite3
                import io

                def analyze_db(db_buffer):
                    # Write buffer to temporary file for sqlite3
                    with open("temp.db", "wb") as f:
                        f.write(db_buffer)
                    
                    conn = sqlite3.connect("temp.db")
                    output = io.BytesIO()
                    
                    with pd.ExcelWriter(output, engine='xlsxwriter') as writer:
                        # Existing logic condensed for web processing
                        for table in ["paciente", "endereco", "pacienteEsus"]:
                            try:
                                df = pd.read_sql_query(f"SELECT * FROM {table}", conn)
                                if table == "paciente":
                                    df[(df['cpf'].isna()) | (df['cpf'].astype(str).str.len() != 11)].to_excel(writer, sheet_name='CPF Invalido', index=False)
                                    df[(df['nomeMae'].isna()) | (df['dataNascimento'].isna())].to_excel(writer, sheet_name='Cadastros Incompletos', index=False)
                            except: pass
                    
                    output.seek(0)
                    return output.getvalue().hex() # Return as hex to transfer
            `);
        }
        init();

        const fileInput = document.getElementById('file-input');
        const processBtn = document.getElementById('process-btn');

        fileInput.onchange = (e) => {
            uploadedFile = e.target.files[0];
            document.getElementById('upload-label').classList.add('hidden');
            const nameEl = document.getElementById('file-name');
            nameEl.textContent = uploadedFile.name;
            nameEl.classList.remove('hidden');
            processBtn.disabled = false;
        };

        processBtn.onclick = async () => {
            const buffer = await uploadedFile.arrayBuffer();
            const resultHex = pyodide.runPython(`analyze_db(bytes.fromhex("${new Uint8Array(buffer).reduce((s, b) => s + b.toString(16).padStart(2, '0'), '')}"))`);
            
            const blob = new Blob([new Uint8Array(resultHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)))], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
            const url = URL.createObjectURL(blob);
            
            const dl = document.getElementById('download-btn');
            dl.href = url;
            dl.download = "analise_saude.xlsx";
            dl.classList.remove('hidden');
            processBtn.classList.add('hidden');
        };
    </script>
</body>
</html>
